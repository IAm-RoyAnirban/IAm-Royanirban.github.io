<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salesforce Lightning Out Login</title>
</head>

<body>
    <h1>My External Page</h1>
    <button onclick="login()">Login with Salesforce</button>
    <div id="aic_lightning_app"></div>

    <!-- Load Lightning Out JavaScript -->
    <script
        src="https://enterprise-enterprise-933-dev-ed.scratch.lightning.force.com/lightning/lightning.out.js"></script>

    <script>
        // Define constants for client ID, redirect URI (must be a page you control), and Salesforce domain
        const CLIENT_ID = '3MVG9D6vJTURvMyt9v8YKcPm7B8TA3vfliZucH9_lTy9bpf2vxJVdHRF8z1dKHE62m6ffhBXxrGzh6OPlETod';
        const REDIRECT_URI = window.location.origin + window.location.pathname; // This page itself
        //const REDIRECT_URI = 'https://test.salesforce.com/services/oauth2/success';
        const SALESFORCE_DOMAIN = 'https://enterprise-enterprise-933-dev-ed.scratch.lightning.force.com';

        // On page load, check if we've been redirected back with an access token from Salesforce
        window.onload = function () {
            // Access token will be in the URL hash fragment if OAuth succeeded
            if (window.location.hash) {
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                const accessToken = params.get('access_token');
                if (accessToken) {
                    // Clean up the URL for UX
                    history.replaceState({}, document.title, window.location.pathname);

                    // Automatically initialize Lightning Out
                    initializeLightningOut(accessToken);
                }
            }
        }

        function login() {
            // Build the Salesforce OAuth authorization URL
            const oauthUrl =
                `https://test.salesforce.com/services/oauth2/authorize` +
                `?response_type=token` +  // Request access token directly
                `&client_id=${encodeURIComponent(CLIENT_ID)}` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&scope=full%20refresh_token`;

            // Redirect the browser for authentication
            window.location = oauthUrl;
        }

        // Function to initialize Lightning Out with the received access token
        function initializeLightningOut(accessToken) {
            $Lightning.use(
                'c:aicExternalApp',       // Aura app name containing your Lightning components
                {},                       // Attributes for the app component if any
                function () {
                    // Create the Lightning component inside the div with id 'aic_lightning_app'
                    $Lightning.createComponent(
                        'c:aicWidgetApp',     // Your Lightning component name
                        {},
                        'aic_lightning_app',
                        function () {
                            console.log('Lightning component loaded with token.');
                        }
                    );
                },
                SALESFORCE_DOMAIN,
                accessToken               // Pass OAuth token for authentication
            );
        }
    </script>
</body>

</html>
