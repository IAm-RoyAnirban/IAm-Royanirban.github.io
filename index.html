<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salesforce Lightning Out Login</title>
</head>

<body>
    <h1>My External Page</h1>
    <button onclick="login()">Login with Salesforce</button>
    <div id="aic_lightning_app"></div>

    <!-- Load Lightning Out JavaScript -->
    <script
        src="https://enterprise-enterprise-933-dev-ed.scratch.my.salesforce.com/lightning/lightning.out.js"></script>

    <script>
        const CLIENT_ID = '3MVG9D6vJTURvMyt9v8YKcPm7B8TA3vfliZucH9_lTy9bpf2vxJVdHRF8z1dKHE62m6ffhBXxrGzh6OPlETod';
        const REDIRECT_URI = window.location.origin + '/oauthcallback.html'; // Redirect URI page on your domain
        const SALESFORCE_DOMAIN = 'https://enterprise-enterprise-933-dev-ed.scratch.my.salesforce.com';

        // Open popup for OAuth login and listen for access token via postMessage
        function login() {
            const oauthUrl =
                'https://test.salesforce.com/services/oauth2/authorize' +
                '?response_type=token' +
                '&client_id=' + encodeURIComponent(CLIENT_ID) +
                '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
                '&scope=full%20api';

            console.log('final oauth URL', oauthUrl);

            const width = 500;
            const height = 600;
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;

            const authWindow = window.open(
                oauthUrl,
                'Salesforce Login',
                `width=${width},height=${height},top=${top},left=${left}`
            );

            window.addEventListener('message', function (event) {
                // Security check: only accept message from your domain
                if (event.origin === window.location.origin) {
                    const accessToken = event.data.access_token;
                    if (accessToken) {
                        initializeLightningOut(accessToken, SALESFORCE_DOMAIN);
                        authWindow.close();
                    }
                }
            }, false);
        }

        // Initialize Lightning Out app with passed access token
        function initializeLightningOut(accessToken, salesforceDomain) {
            //console.log('access token', accessToken);
            
            $Lightning.use(
                'c:aicExternalApp',
                function () {
                    $Lightning.createComponent(
                        'c:aicWidgetApp',
                        {},
                        'aic_lightning_app',
                        function (cmp) {
                            console.log('The component was created.');
                        }
                    );
                },
                salesforceDomain, accessToken
            );
        }
    </script>

</body>
</html>
